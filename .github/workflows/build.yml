name: Build DocRefine Pro (Multi-OS)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  # ====================================================
  # JOB 1: WINDOWS BUILD (Stable at ~250MB)
  # ====================================================
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install UPX (Windows)
      run: choco install upx

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # v128 Update: Spec-First Build (CLI overrides removed)
    - name: Build with PyInstaller
      run: |
        pyinstaller DocRefinePro.spec --noconfirm --clean

    - name: Bundle Readme & Changelog
      run: |
        copy README.md dist/DocRefinePro/
        copy CHANGELOG.md dist/DocRefinePro/
        copy LICENSE dist/DocRefinePro/

    - name: Zip the Build
      run: |
        powershell Compress-Archive -Path dist/DocRefinePro -DestinationPath DocRefinePro_Win_${{ github.ref_name }}.zip

    - name: Release Windows Artifact
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: DocRefinePro_Win_${{ github.ref_name }}.zip

  # ====================================================
  # JOB 2: MAC BUILD (Surgical Stripping v128.4)
  # ====================================================
  build-mac:
    name: macOS Build
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Mac System Deps
      run: |
        brew update
        brew install poppler tesseract tesseract-lang create-dmg upx

    - name: Install Python Libs
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # v128 Update: Spec-First Build (CLI overrides removed)
    - name: Build Mac App
      run: |
        pyinstaller DocRefinePro.spec --noconfirm --clean

    - name: Mac Smoke Test (Dry Run)
      run: |
        echo "Booting DocRefine Pro headless..."
        ./dist/DocRefinePro.app/Contents/MacOS/DocRefinePro --dry-run
        echo "Smoke test passed. App initialization successful."

    - name: Create DMG Installer
      run: |
        mkdir -p dist/dmg_content
        # Use -a to preserve structure and symlinks safely (CRITICAL FIX)
        cp -a "dist/DocRefinePro.app" dist/dmg_content
        cp README.md dist/dmg_content/
        cp CHANGELOG.md dist/dmg_content/
        cp LICENSE dist/dmg_content/

        create-dmg \
          --volname "DocRefinePro Installer" \
          --window-pos 200 120 \
          --window-size 800 500 \
          --icon-size 100 \
          --icon "DocRefinePro.app" 200 190 \
          --hide-extension "DocRefinePro.app" \
          --app-drop-link 600 185 \
          --icon "README.md" 200 350 \
          --icon "CHANGELOG.md" 400 350 \
          --icon "LICENSE" 600 350 \
          "dist/DocRefinePro_Mac_${{ github.ref_name }}.dmg" \
          "dist/dmg_content"

    - name: Release Mac Artifact
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/DocRefinePro_Mac_${{ github.ref_name }}.dmg

  # ====================================================
  # JOB 3: PROJECT TRACKING
  # Posts the release notes to the ClickUp project task so the
  # tracker never drifts behind what has actually shipped.
  # Runs only when BOTH builds succeeded, so the task is never
  # told about a release that does not exist.
  # ====================================================
  notify-clickup:
    name: Update ClickUp Task
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Post release notes to ClickUp
      env:
        CLICKUP_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        CLICKUP_TASK_ID: 86ex00r23          # DocRefine Pro (parent project task)
        VERSION: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        # Report the outcome to the run summary, which is readable without repo
        # admin rights. A silent "success" that did nothing is worse than a
        # visible skip: the first live run looked green but posted nothing.
        if [ -z "$CLICKUP_TOKEN" ]; then
          {
            echo "### ⚠️ ClickUp not updated"
            echo ""
            echo "\`CLICKUP_API_TOKEN\` was **not visible to this job**, so \`$VERSION\` was not posted."
            echo ""
            echo "Check that the secret is a **repository** secret (Settings → Secrets and"
            echo "variables → Actions → *Repository secrets*), spelled exactly"
            echo "\`CLICKUP_API_TOKEN\`. Environment and Dependabot secrets are not visible here."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=ClickUp not updated::CLICKUP_API_TOKEN is not visible to this job."
          exit 0
        fi
        echo "Token is visible to the job (${#CLICKUP_TOKEN} characters). Posting…"
        python3 - <<'PY'
        import json, os, re, urllib.request

        version = os.environ["VERSION"]
        repo    = os.environ["REPO"]
        task    = os.environ["CLICKUP_TASK_ID"]

        # Pull this version's section out of the changelog.
        notes = ""
        try:
            text = open("CHANGELOG.md", encoding="utf-8").read()
            m = re.search(r"^##\s*\[%s\].*?$(.*?)(?=^##\s*\[|\Z)" % re.escape(version),
                          text, re.M | re.S)
            if m:
                notes = m.group(1).strip()
        except OSError:
            pass
        if not notes:
            notes = "_No changelog section found for this version._"
        if len(notes) > 8000:
            notes = notes[:8000].rstrip() + "\n\n…truncated — see the full changelog."

        body = (
            f"### 🚀 {version} released\n\n"
            f"{notes}\n\n"
            f"[Release notes and downloads](https://github.com/{repo}/releases/tag/{version})\n\n"
            f"_Posted automatically by the build pipeline once the Windows and macOS "
            f"builds both succeeded._"
        )

        req = urllib.request.Request(
            f"https://api.clickup.com/api/v2/task/{task}/comment",
            data=json.dumps({"comment_text": body, "notify_all": False}).encode(),
            headers={"Authorization": os.environ["CLICKUP_TOKEN"],
                     "Content-Type": "application/json"},
            method="POST")
        with urllib.request.urlopen(req, timeout=30) as r:
            payload = json.loads(r.read() or b"{}")
            status = r.status

        # ClickUp answers a successful create with the new comment's id. Treat a
        # 2xx without one as a failure rather than reporting a green step that
        # quietly did nothing.
        comment_id = payload.get("id")
        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if comment_id:
            line = f"### ✅ ClickUp updated\n\n`{version}` posted to task `{task}` (comment `{comment_id}`)."
            print(f"HTTP {status} — comment {comment_id} created on task {task}.")
        else:
            line = (f"### ⚠️ ClickUp did not accept the comment\n\n"
                    f"HTTP {status}, but no comment id came back. Response: `{payload}`")
            print(f"HTTP {status} but no comment id in the response: {payload}")
        if summary:
            with open(summary, "a", encoding="utf-8") as f:
                f.write(line + "\n")
        if not comment_id:
            raise SystemExit(1)
        PY