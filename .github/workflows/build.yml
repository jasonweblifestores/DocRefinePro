name: Build DocRefine Pro (Multi-OS)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # Lets the ClickUp step be exercised on its own, without cutting a release.
  # The builds are skipped for a manual run — this only posts the announcement.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (e.g. v141). Posts to ClickUp; does not build.'
        required: true
        default: 'v141'

jobs:
  # ====================================================
  # JOB 1: WINDOWS BUILD (Stable at ~250MB)
  # ====================================================
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install UPX (Windows)
      run: choco install upx

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # v128 Update: Spec-First Build (CLI overrides removed)
    - name: Build with PyInstaller
      run: |
        pyinstaller DocRefinePro.spec --noconfirm --clean

    # Prove the PACKAGED app can actually brand a PDF with every page stamp on.
    # A boot smoke test cannot see a missing hidden import, or a bundled font
    # that fails to resolve — which silently drops every stamp rather than
    # erroring. The app builds its own inputs, so there is nothing to check in.
    - name: Packaged Rebrand Self-Test (Windows)
      shell: pwsh
      run: |
        $p = Start-Process -FilePath dist/DocRefinePro/DocRefinePro.exe `
             -ArgumentList "--self-test-rebrand","selftest_work" -PassThru -Wait
        if (Test-Path selftest_work/_self_test_report.txt) {
          Get-Content selftest_work/_self_test_report.txt
        }
        if ($p.ExitCode -ne 0) { throw "packaged rebrand self-test failed" }

    - name: Bundle Readme & Changelog
      run: |
        copy README.md dist/DocRefinePro/
        copy CHANGELOG.md dist/DocRefinePro/
        copy LICENSE dist/DocRefinePro/

    - name: Zip the Build
      run: |
        powershell Compress-Archive -Path dist/DocRefinePro -DestinationPath DocRefinePro_Win_${{ github.ref_name }}.zip

    - name: Release Windows Artifact
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: DocRefinePro_Win_${{ github.ref_name }}.zip

  # ====================================================
  # JOB 2: MAC BUILD (Surgical Stripping v128.4)
  # ====================================================
  build-mac:
    name: macOS Build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Mac System Deps
      run: |
        brew update
        brew install poppler tesseract tesseract-lang create-dmg upx

    - name: Install Python Libs
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # v128 Update: Spec-First Build (CLI overrides removed)
    - name: Build Mac App
      run: |
        pyinstaller DocRefinePro.spec --noconfirm --clean

    - name: Mac Smoke Test (Dry Run)
      run: |
        echo "Booting DocRefine Pro headless..."
        ./dist/DocRefinePro.app/Contents/MacOS/DocRefinePro --dry-run
        echo "Smoke test passed. App initialization successful."

    # The same packaged rebrand as the Windows job — the Mac bundle resolves its
    # assets through a different layout, so it has to be proven separately.
    - name: Packaged Rebrand Self-Test (macOS)
      run: |
        set -e
        ./dist/DocRefinePro.app/Contents/MacOS/DocRefinePro --self-test-rebrand selftest_work || rc=$?
        [ -f selftest_work/_self_test_report.txt ] && cat selftest_work/_self_test_report.txt
        exit ${rc:-0}

    - name: Create DMG Installer
      run: |
        mkdir -p dist/dmg_content
        # Use -a to preserve structure and symlinks safely (CRITICAL FIX)
        cp -a "dist/DocRefinePro.app" dist/dmg_content
        cp README.md dist/dmg_content/
        cp CHANGELOG.md dist/dmg_content/
        cp LICENSE dist/dmg_content/

        create-dmg \
          --volname "DocRefinePro Installer" \
          --window-pos 200 120 \
          --window-size 800 500 \
          --icon-size 100 \
          --icon "DocRefinePro.app" 200 190 \
          --hide-extension "DocRefinePro.app" \
          --app-drop-link 600 185 \
          --icon "README.md" 200 350 \
          --icon "CHANGELOG.md" 400 350 \
          --icon "LICENSE" 600 350 \
          "dist/DocRefinePro_Mac_${{ github.ref_name }}.dmg" \
          "dist/dmg_content"

    - name: Release Mac Artifact
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/DocRefinePro_Mac_${{ github.ref_name }}.dmg

  # ====================================================
  # JOB 3: PROJECT TRACKING
  # Adds a subtask to the ClickUp project task for each release, matching
  # how the rest of the Project Management list is read. Runs only when
  # BOTH builds succeeded, so the board never shows a release that does
  # not exist. Only ever creates — never edits an existing subtask.
  # ====================================================
  notify-clickup:
    name: Update ClickUp Task
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    # On a tag: only when BOTH builds passed, so the task is never told about a
    # release that does not exist. On a manual run: the builds are skipped, so
    # allow it through explicitly.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.build-windows.result == 'success' && needs.build-mac.result == 'success'))

    steps:
    - uses: actions/checkout@v4

    - name: Add release subtask in ClickUp
      env:
        CLICKUP_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        CLICKUP_TASK_ID: 86ex00r23            # DocRefine Pro (parent project task)
        CLICKUP_LIST_ID: '901815817512'       # Project Managment
        CLICKUP_STATUS: done / review
        CLICKUP_ITEM_ID: '1003'               # the list's "Project" task type
        VERSION: ${{ inputs.version || github.ref_name }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
      run: |
        # Report the outcome to the run summary, which is readable without repo
        # admin rights. A silent "success" that did nothing is worse than a
        # visible skip: the first live run looked green but posted nothing.
        if [ -z "$CLICKUP_TOKEN" ]; then
          {
            echo "### ⚠️ ClickUp not updated"
            echo ""
            echo "\`CLICKUP_API_TOKEN\` was **not visible to this job**, so \`$VERSION\` was not added."
            echo ""
            echo "Check that the secret is a **repository** secret (Settings → Secrets and"
            echo "variables → Actions → *Repository secrets*), spelled exactly"
            echo "\`CLICKUP_API_TOKEN\`. Environment and Dependabot secrets are not visible here."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=ClickUp not updated::CLICKUP_API_TOKEN is not visible to this job."
          exit 0
        fi
        echo "Token is visible to the job (${#CLICKUP_TOKEN} characters)."
        python3 - <<'PY'
        import json, os, re, urllib.request

        API     = "https://api.clickup.com/api/v2"
        HDRS    = {"Authorization": os.environ["CLICKUP_TOKEN"],
                   "Content-Type": "application/json"}
        version = os.environ["VERSION"]
        repo    = os.environ["REPO"]
        task    = os.environ["CLICKUP_TASK_ID"]
        list_id = os.environ["CLICKUP_LIST_ID"]
        manual  = os.environ.get("EVENT") == "workflow_dispatch"
        TEST_PREFIX = "[pipeline test] "

        def call(method, path, payload=None):
            req = urllib.request.Request(
                API + path,
                data=json.dumps(payload).encode() if payload is not None else None,
                headers=HDRS, method=method)
            with urllib.request.urlopen(req, timeout=30) as r:
                return r.status, json.loads(r.read() or b"{}")

        def write_summary(md):
            path = os.environ.get("GITHUB_STEP_SUMMARY")
            if path:
                with open(path, "a", encoding="utf-8") as f:
                    f.write(md + "\n")

        # Pull this version's section out of the changelog.
        notes = ""
        try:
            text = open("CHANGELOG.md", encoding="utf-8").read()
            m = re.search(r"^##\s*\[%s\].*?$(.*?)(?=^##\s*\[|\Z)" % re.escape(version),
                          text, re.M | re.S)
            if m:
                notes = m.group(1).strip()
        except OSError:
            pass
        if not notes:
            notes = "_No changelog section found for this version._"
        if len(notes) > 8000:
            notes = notes[:8000].rstrip() + "\n\n…truncated — see the full changelog."

        # Name it the way the board already names things: "<outcome> (vNNN)".
        # The changelog's first section heading is the closest thing we have to
        # the hand-written outcome names on the existing subtasks.
        outcome = ""
        heading = re.search(r"^###\s+(.*)$", notes, re.M)
        if heading:
            outcome = heading.group(1).strip()
            # "Changed — Simple, customer-facing cover titles" -> the part that says something
            bits = re.split(r"\s+[—–-]\s+", outcome, maxsplit=1)
            if len(bits) == 2 and len(bits[1]) > 3:
                outcome = bits[1]
            outcome = outcome.strip(" .")
        outcome = outcome or "Release"
        if len(outcome) > 80:
            outcome = outcome[:77].rstrip() + "…"
        name = f"{outcome[0].upper()}{outcome[1:]} ({version})"
        if manual:
            name = TEST_PREFIX + name

        footer = ("_Created by a manual pipeline test — no build was run and nothing "
                  "was released._" if manual else
                  "_Added automatically once the Windows and macOS builds both succeeded._")
        body = (
            f"{notes}\n\n"
            f"[Release notes and downloads](https://github.com/{repo}/releases/tag/{version})\n\n"
            f"{footer}"
        )

        # Only ever create. Several hand-written subtasks can share a version,
        # and a re-run must never overwrite one of them.
        _, parent = call("GET", f"/task/{task}?include_subtasks=true")
        suffix = f"({version})"
        for t in (parent.get("subtasks") or []):
            existing = (t.get("name") or "").strip()
            if existing.endswith(suffix) and existing.startswith(TEST_PREFIX) == manual:
                write_summary(f"### ✅ ClickUp already tracks {version}\n\n"
                              f"Existing subtask `{existing}` — nothing to add.")
                print(f"Already tracked by subtask {t.get('id')} ({existing}).")
                raise SystemExit(0)

        status, res = call("POST", f"/list/{list_id}/task", {
            "name": name,
            "markdown_description": body,
            "status": os.environ["CLICKUP_STATUS"],
            "parent": task,
            "custom_item_id": int(os.environ["CLICKUP_ITEM_ID"]),
        })

        # A 2xx with no task id means nothing was created — do not report green.
        new_id = res.get("id")
        if not new_id:
            write_summary(f"### ⚠️ ClickUp did not accept the subtask\n\n"
                          f"HTTP {status}, no task id returned. Response: `{res}`")
            print(f"HTTP {status} but no task id in the response: {res}")
            raise SystemExit(1)
        write_summary(f"### ✅ ClickUp updated\n\n"
                      f"Added subtask **{name}** (`{new_id}`) under `{task}`.")
        print(f"HTTP {status} — created subtask {new_id}: {name}")
        PY